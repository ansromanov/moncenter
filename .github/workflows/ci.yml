name: CI

# One gate for pull requests and pushes to main. Runs on Arch (the target distro) so PySide6 and
# Qt are the versions the app is used with.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lint, file size, tests
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Dependencies
        run: |
          pacman -Syu --noconfirm --needed git python pyside6 ruff shellcheck
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ruff
        run: ruff check app tests
      - name: Shellcheck
        run: shellcheck install.sh tests/run.sh
      - name: File size limit
        run: python3 scripts/check-file-size.py
      - name: Tests
        run: tests/run.sh
